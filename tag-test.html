<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>StyleDNA photo tag test</title>
<style>body{margin:0;background:#030C0D;color:#F5F5F3;font:15px/1.5 -apple-system,Segoe UI,sans-serif;padding:24px}b{color:#E0B24D}</style>
</head><body>
<h1>StyleDNA photo tag test</h1>
<p id="s">Waiting for listings from the Matrix tab.</p>
<script>
// Internal test page. The Matrix tab opens this page with the listing photo links in the address after "#"
// (that part never goes to a server). This page sends them to /api/tag-photo and shows the results.
const s = document.getElementById('s');
window.__out = null;
async function run(homes) {
  const out = [];
  for (let i = 0; i < homes.length; i += 25) {
    s.innerHTML = `Tagging <b>${i}</b> of ${homes.length}...`;
    try {
      const r = await fetch('/api/tag-photo', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ homes: homes.slice(i, i + 25) }) });
      const j = await r.json();
      out.push(...(j.results || [{ error: j.error || ('http_' + r.status) }]));
    } catch (e) { out.push({ error: 'fetch_failed', detail: String(e) }); }
  }
  window.__out = out;
  s.innerHTML = `Done: <b>${out.length}</b> homes tagged. You can close this tab.`;
}
const h = location.hash.slice(1);
if (h) {
  let homes = [];
  try { homes = JSON.parse(decodeURIComponent(h)).homes || []; } catch (e) { s.textContent = 'Could not read the listings.'; }
  history.replaceState(null, '', location.pathname);
  if (homes.length) run(homes);
}
</script>
</body></html>
